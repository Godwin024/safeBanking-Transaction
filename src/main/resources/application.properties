spring.application.name=SafeBanking

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:safebankdb
spring.datasource.username=sa
spring.datasource.password=

# Now lets Hibernate create the tables from our entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Browser console to look inside the database
spring.h2.console.enabled=true